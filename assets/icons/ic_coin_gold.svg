<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="coinRim" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <!-- Face Gradient -->
    <linearGradient id="coinFace" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <!-- Star Emblem Gradient -->
    <linearGradient id="starGrad" x1="24" y1="14" x2="24" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
  </defs>

  <!-- Coin Shadow -->
  <circle cx="24" cy="26" r="20" fill="#E65100" opacity="0.2" />

  <!-- Coin Outer Rim (Bevel) -->
  <circle cx="24" cy="24" r="20" fill="url(#coinRim)" />

  <!-- Coin Inner Face -->
  <circle cx="24" cy="24" r="16.5" fill="url(#coinFace)" stroke="#FFA000" stroke-width="1" />

  <!-- Inner Dotted/Dashed Ring Accent -->
  <circle cx="24" cy="24" r="14" stroke="#FFE082" stroke-width="1" stroke-dasharray="2 2" opacity="0.8" />

  <!-- Center Star Emblem -->
  <path d="M24 16L26.472 21.01L32 21.815L28 25.715L28.944 31.22L24 28.62L19.056 31.22L20 25.715L16 21.815L21.528 21.01L24 16Z" fill="url(#starGrad)" />

  <!-- Top Glass Highlight -->
  <path d="M12 18C14 13 18.5 10 24 10C29.5 10 34 13 36 18C30 14 18 14 12 18Z" fill="#FFFFFF" opacity="0.6" />
</svg>
